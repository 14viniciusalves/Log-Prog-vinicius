        <input type="radio" name="doenca" id="doencanao" value="não">

    <!-- Entrada - Peso atual -->

        <label for="massa">peso atual</label>

    </p>
    <!-- Entrada - tatuagem-->

        <label for="">tem tatuagem recente?</label>

        <label for="tatuyes">sim</label>
        <input type="radio" name="tatu" id="tatuno" value="no">
        <label for="tatuno">nao</label>

    </p>
    <p>
        <!-- Entrada - medicaçao -->
        <label for="">tomando algum medicamento</label>

        <label for="">sim</label>
